<main>
  <h1>ngx-echarts-compose demo</h1>

  <ec-chart ecCanvas class="demo-chart">
    <ec-value-x-axis #x="ecValueXAxis" />
    <ec-value-y-axis #y="ecValueYAxis" />
    <ec-line-series [xAxis]="x" [yAxis]="y" [data]="lineData()" [name]="'Line'" />
    <ec-bar-series [xAxis]="x" [yAxis]="y" [data]="barData()" [name]="'Bar'" />
  </ec-chart>
</main>
